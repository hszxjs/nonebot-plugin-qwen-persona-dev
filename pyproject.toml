[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-ai-companion"
version = "0.2.0"
description = "NoneBot AI companion plugin: domain-driven refactor of qwen-persona with MLX/GLM providers, stickers, and LoRA training."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nonebot2[fastapi,httpx]>=2.5.0",
    "pydantic>=2.0",
    "httpx>=0.24",
    "huggingface-hub>=0.24",
    "mlx-vlm>=0.6.4",
    "alembic>=1.13",
]

[project.optional-dependencies]
onebot = ["nonebot-adapter-onebot>=2.4.6"]
scheduler = ["nonebot-plugin-apscheduler>=0.5.0"]
dev = [
    "nb-cli>=1.5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyrefly>=0.2",
]

[tool.setuptools.packages.find]
include = ["nonebot_plugin_ai_companion*"]

[tool.setuptools.package-data]
nonebot_plugin_ai_companion = [
    "webui_static/index.html",
    "webui_static/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["webui", "webui_static", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # 长行留给 formatter 处理，存量代码里有长字符串提示词
    "SIM102",  # 存量嵌套 if 表达的是决策层级，强并会降低可读性
    "SIM103",  # 显式 return True/False 的分支带注释语义，不内联
    "SIM108",  # 多行 if/else 比 ternary 更可读（含中文注释的存量分支）
    "SIM117",  # 嵌套 with 在 sqlite 连接管理里更清晰
]

[tool.pyrefly]
project-excludes = [
    "webui/**",
    "webui_static/**",
    "data/**",
    "tests/**",
]

[tool.nonebot]
plugin_dirs = []
builtin_plugins = []

[tool.nonebot.plugins]
nonebot-plugin-ai-companion = ["nonebot_plugin_ai_companion"]
