[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-qwen-persona"
version = "0.1.0"
description = "NoneBot plugin for embedded MLX-VLM Qwen persona chat, learning samples, stickers, and LoRA training."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nonebot2[fastapi,httpx]>=2.5.0",
    "pydantic>=2.0",
    "httpx>=0.24",
    "mlx-vlm>=0.6.4",
]

[project.optional-dependencies]
onebot = ["nonebot-adapter-onebot>=2.4.6"]
scheduler = ["nonebot-plugin-apscheduler>=0.5.0"]
dev = ["nb-cli>=1.5.0"]

[tool.setuptools]
packages = ["nonebot_plugin_qwen_persona"]

[tool.nonebot]
plugin_dirs = []
builtin_plugins = []

[tool.nonebot.plugins]
nonebot-plugin-qwen-persona = ["nonebot_plugin_qwen_persona"]
