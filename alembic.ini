# Alembic 迁移配置（第五期引入；运行时建表仍由 ensure_schema 幂等兜底）
[alembic]
script_location = migrations
# url 运行时由 migrations/env.py 从环境变量/默认路径解析，此处仅占位
sqlalchemy.url = sqlite:///data/qwen_persona/persona.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
